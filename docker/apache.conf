<VirtualHost *:80>
    # Main site: output of `npm run b`
    DocumentRoot /srv/core9/build
    <Directory /srv/core9/build>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    # Blog (PHP), served at /insights/ as on core9.ai, relying on its own .htaccess files to protect
    # config/, src/, database/ and .env
    Alias /insights /srv/core9/blog
    <Directory /srv/core9/blog>
        Options -Indexes
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>
</VirtualHost>
